<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nothing here — AMRI Group</title>
<meta name="robots" content="noindex">
<script>
/* Same pre-paint theme bootstrap as index.html — the 404 must not flash. */
(function(){
  try{
    var t = localStorage.getItem("amri-theme");
    if(t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  }catch(e){ document.documentElement.setAttribute("data-theme","light"); }
})();
</script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&f[]=clash-grotesk@400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ink:#131316; --paper:#F0EBE1; --red:#781F2A;
  --line:rgba(19,19,22,0.16); --muted:rgba(19,19,22,0.58); --muted-2:rgba(19,19,22,0.40);
  --atmo-light:rgba(255,251,240,.92); --atmo-warm:rgba(120,31,42,.055);
  --atmo-mineral:rgba(122,132,148,.07); --atmo-vignette:rgba(19,19,22,.05);
  --gutter:clamp(20px,5vw,72px);
  --sans:"Switzer","Helvetica Neue",Arial,sans-serif;
  --arch:"Clash Grotesk","Switzer",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme="dark"]{
  color-scheme:dark;
  --ink:#F0EBE1; --paper:#17171A; --red:#8E3540;
  --line:rgba(240,235,225,0.13); --muted:rgba(240,235,225,0.60); --muted-2:rgba(240,235,225,0.40);
  --atmo-light:rgba(240,235,225,.045); --atmo-warm:rgba(142,53,64,.13);
  --atmo-mineral:rgba(120,140,170,.05); --atmo-vignette:rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
/* the same atmosphere as the hero — one page, one company */
body::before{
  content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 82% 60% at 84% 2%,  var(--atmo-light),   transparent 60%),
    radial-gradient(ellipse 56% 46% at 8% 92%,  var(--atmo-warm),    transparent 64%),
    radial-gradient(ellipse 60% 70% at 30% 30%, var(--atmo-mineral), transparent 58%),
    radial-gradient(ellipse 128% 112% at 50% 44%, transparent 50%, var(--atmo-vignette) 100%);
}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--gutter);width:100%;position:relative;z-index:1}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;height:60px}
.bw{font-weight:600;letter-spacing:0.18em;font-size:13px;text-decoration:none;color:inherit}
main{flex:1;display:flex;align-items:center;padding:clamp(56px,12vw,120px) 0}
.meta{
  font-family:var(--mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--muted-2);padding-bottom:20px;border-bottom:1px solid var(--line);
  margin-bottom:clamp(32px,5vw,52px);
}
h1{
  font-family:var(--arch);font-weight:500;font-size:clamp(44px,9vw,104px);
  line-height:0.98;letter-spacing:-0.02em;
}
p{
  margin-top:clamp(22px,3vw,30px);font-size:clamp(16px,2vw,19px);
  line-height:1.55;color:var(--muted);max-width:44ch;
}
.cta{
  display:inline-flex;align-items:center;gap:12px;margin-top:clamp(32px,4vw,44px);
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);
  font-family:var(--mono);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;
  padding:13px 24px;text-decoration:none;
  transition:background .25s var(--ease),border-color .25s var(--ease);
}
.cta:hover{background:var(--red);border-color:var(--red);color:#F0EBE1}
.cta .arr{transition:transform .25s var(--ease)}
.cta:hover .arr{transform:translateX(4px)}
a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
footer{border-top:1px solid var(--line);padding:26px 0}
footer .wrap{
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10.5px;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--muted-2);
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap"><a class="bw" href="/">AMRI&nbsp;GROUP</a></div>
</header>

<main>
  <div class="wrap">
    <div class="meta">Error 404</div>
    <h1>Nothing here.</h1>
    <p>The page may have moved, or the address may be wrong. Everything AMRI Group does lives on the home page.</p>
    <a class="cta" href="/">Return home <span class="arr" aria-hidden="true">&rarr;</span></a>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>&copy; 2026 AMRI Group</span>
    <span>Atlanta, Georgia</span>
  </div>
</footer>
</body>
</html>
